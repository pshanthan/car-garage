<form [formGroup]="carForm" (ngSubmit)="onSubmit()">
  <input formControlName="make" />
  <input formControlName="model" />
  <input formControlName="year" />
  <input formControlName="mileage" />
  <button type="submit">SUBMIT</button>
</form>

<div *ngFor="let car of cars">
  <button (click)="startEdit(car)">EDIT</button>
  <button (click)="deleteCar(car)">Delete</button>
  <app-car-card [car]="car"></app-car-card>
</div>
